# HomeNet router plugin configuration (sourced by /usr/libexec/rpcd/homenet)

# How to read LTE signal: auto | mmcli (ModemManager) | uqmi (QMI) | at (sms_tool AT commands) | none
MODEM_METHOD=auto
# AT command port (the same one sms_tool uses)
AT_DEVICE=/dev/ttyUSB2
# QMI control device (only for MODEM_METHOD=uqmi)
QMI_DEVICE=/dev/cdc-wdm0
# Command that prints SMS as JSON; empty = "sms_tool -d $AT_DEVICE -j recv"
SMS_CMD=""
# Max conntrack flow deltas returned per poll
CONNTRACK_MAX=4000
