manifestVersion: 1
id: ruggero-homenet
name: HomeNet
tagline: Router watchdog, traffic analytics and where your devices send data
icon: https://raw.githubusercontent.com/OWNER/homenet/main/umbrel/ruggero-homenet/icon.svg
category: networking
version: "0.1.0"
port: 8790
description: >-
  HomeNet monitors your OpenWrt router (LTE / Wi-Fi signal, WAN status, latency) and can
  restart the connection or the router automatically when internet drops.


  It combines conntrack byte counters from the router with AdGuard Home DNS logs to show
  which device moves the most traffic, which services it talks to, and in which countries
  and networks the servers are located — with alerts for watch-listed countries such as China.


  Requires the small HomeNet rpcd plugin on the router (see the project README).
developer: Ruggero
website: https://github.com/OWNER/homenet
