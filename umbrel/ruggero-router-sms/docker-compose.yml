version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: ruggero-router-sms_web_1
      APP_PORT: 5000

  web:
    image: ghcr.io/ruggerocapo/openwrt-sms-ui:1.0.0
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
